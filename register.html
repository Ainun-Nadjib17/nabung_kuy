<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - TabungKu</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="logo">💰 TabungKu</div>
            <h2>Buat Akun Baru</h2>
            <p class="subtitle">Mulai perjalanan menabungmu</p>

            <div id="registerError" class="error-msg"></div>

            <form id="registerForm" onsubmit="return false;">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="registerName" placeholder="Nama kamu" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" placeholder="email@contoh.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="registerPassword" placeholder="Minimal 6 karakter" required>
                </div>
                <button type="button" class="btn btn-primary" onclick="register()">
                    <span id="registerText">Daftar</span>
                    <span id="registerLoading" class="loading hidden"></span>
                </button>
            </form>

            <div class="auth-switch">
                Sudah punya akun? <a href="index.html">Masuk sekarang</a>
            </div>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
     <meta name="google-site-verification" content="bZWZ7Spwy9jpLqWMIpkMWuaqhkKUJY6DFtmKJCcdtag" />
  <title>Nabung Kuy</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="logo">💰 TabungKu</div>
            <h2>Selamat Datang Kembali</h2>
            <p class="subtitle">Masuk untuk melanjutkan menabung</p>

            <div id="loginError" class="error-msg"></div>

            <form id="loginForm" onsubmit="return false;">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="email@contoh.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="button" class="btn btn-primary" onclick="login()">
                    <span id="loginText">Masuk</span>
                    <span id="loginLoading" class="loading hidden"></span>
                </button>
            </form>

            <div class="auth-switch">
                Belum punya akun? <a href="register.html">Daftar sekarang</a>
            </div>
        </div>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
